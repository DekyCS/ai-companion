<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Khina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --card: rgba(255, 251, 242, 0.88);
        --ink: #3b2f25;
        --soft: #7a6a5a;
        --accent: #c4703f;
        --bar: #e6dccb;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe0ea; font-family: Nunito, ui-rounded, system-ui, sans-serif; color: var(--ink); }
      #app { position: fixed; inset: 0; }
      .card { position: fixed; background: var(--card); border-radius: 16px; padding: 12px 14px; box-shadow: 0 6px 24px rgba(40, 30, 20, 0.15); backdrop-filter: blur(6px); }
      #now { top: 16px; left: 16px; width: min(360px, calc(100vw - 32px)); }
      #now h1 { margin: 0; font-size: 20px; font-weight: 800; }
      #when { font-size: 13px; color: var(--soft); margin-top: 2px; }
      #doing { margin-top: 8px; font-size: 16px; font-weight: 700; }
      #why { font-size: 14px; color: var(--soft); font-style: italic; margin-top: 2px; min-height: 1em; }
      #needs { display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; margin-top: 10px; font-size: 12px; align-items: center; }
      .bar { height: 7px; background: var(--bar); border-radius: 4px; overflow: hidden; }
      .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.6s; }
      .bar.mood > i { background: #6aa84f; }
      #diary { bottom: 16px; left: 16px; width: min(560px, calc(100vw - 32px)); max-height: 34vh; overflow: hidden; font-size: 14px; }
      #diary h2 { margin: 0 0 6px; font-size: 13px; color: var(--soft); font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }
      #diary p { margin: 4px 0; line-height: 1.35; }
      #diary time { color: var(--soft); font-size: 12px; margin-right: 6px; }
      #tools { top: 16px; right: 16px; font-size: 13px; display: flex; gap: 10px; align-items: center; }
      #tools button { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 6px 10px; background: var(--bar); color: var(--ink); cursor: pointer; }
      #tools button[aria-pressed='true'] { background: var(--accent); color: white; }
      #status { position: fixed; inset: 0; display: grid; place-items: center; font-size: 18px; font-weight: 800; color: var(--ink); pointer-events: none; }
      #hint { bottom: 16px; right: 16px; font-size: 13px; color: var(--soft); padding: 8px 12px; }
      #hint b { color: var(--ink); }
      canvas { outline: none; }
      @media (max-width: 640px) { #tools { top: auto; bottom: calc(34vh + 32px); } #diary { font-size: 13px; } }
    </style>
    <script type="importmap">
      { "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <section id="now" class="card" hidden>
      <h1>Khina</h1>
      <div id="when"></div>
      <div id="doing"></div>
      <div id="why"></div>
      <div id="needs"></div>
    </section>
    <section id="diary" class="card" hidden><h2>Diary</h2><div id="lines"></div></section>
    <div id="tools" class="card" hidden>
      <span id="brain"></span>
      <button id="follow" aria-pressed="true">Follow Khina</button>
      <button id="walk" aria-pressed="false">Walk around</button>
    </div>
    <div id="hint" class="card" hidden><b>WASD</b> walk · <b>Shift</b> run · <b>Space</b> hop · drag to look</div>
    <div id="status">Waking up the village…</div>
    <script type="module" src="/web/main.ts"></script>
  </body>
</html>
